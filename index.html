<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotador — Parts Pricing</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c1e1f">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --charcoal:#1c1e1f;
    --charcoal-2:#26282a;
    --steel:#4a4f54;
    --steel-light:#6b7076;
    --paper:#edeeec;
    --amber:#e8a93b;
    --green:#4c9a6a;
    --red:#c24b3f;
    --line:#3a3d3f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    color:var(--paper);
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .plate{border:2px solid var(--steel); border-radius:4px; padding:16px 18px; margin-bottom:20px;}
  .eyebrow{font-size:11px; letter-spacing:0.18em; color:var(--amber); text-transform:uppercase; margin:0 0 4px;}
  h1{font-size:26px; letter-spacing:0.02em; margin:0 0 6px; text-transform:uppercase;}
  .sub{font-size:14px; color:var(--steel-light); margin:0; line-height:1.4;}
  .ticket{background:var(--charcoal-2); border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:20px;}
  label{display:block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel-light); margin-bottom:6px;}
  input[type=text], input[type=number]{width:100%; background:var(--charcoal); border:1px solid var(--line); color:var(--paper); padding:10px 12px; border-radius:4px; font-size:15px; margin-bottom:14px;}
  button{width:100%; background:var(--amber); color:var(--charcoal); border:none; padding:13px; border-radius:4px; font-size:15px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; cursor:pointer;}
  button:disabled{background:var(--steel); color:var(--steel-light); cursor:not-allowed;}
  .loading{text-align:center; padding:20px; color:var(--amber); font-size:13px; letter-spacing:0.05em; text-transform:uppercase;}
  .error-box{background:rgba(194,75,63,0.12); border:1px solid var(--red); border-radius:4px; padding:14px; font-size:14px; color:#e8a99f;}
  .result{background:var(--charcoal-2); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:16px;}
  .result-head{background:var(--charcoal); padding:14px 18px; border-bottom:1px dashed var(--line); font-size:16px; text-transform:uppercase;}
  .headline-price{text-align:center; padding:20px 0 14px;}
  .headline-price .amt{font-family:'Courier New',monospace; font-size:38px; font-weight:700; color:var(--amber);}
  .headline-price .cap{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--steel-light); margin-top:2px;}
  .flag-box{margin:0 18px 14px; padding:12px 14px; border-radius:4px; font-size:13.5px; line-height:1.4; background:rgba(76,154,106,0.14); border:1px solid var(--green); color:#bfe3cd;}
  .result-body{padding:4px 18px 16px;}
  .line-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .line-item:last-child{border-bottom:none;}
  .line-label{color:var(--steel-light);}
  .line-value{font-family:'Courier New',monospace;}
  .caveat{margin:0 18px 16px; padding:10px 12px; background:rgba(255,255,255,0.03); border-left:2px solid var(--steel); font-size:12.5px; color:var(--steel-light); line-height:1.4;}
  .sources{padding:12px 18px 16px; border-top:1px dashed var(--line);}
  .sources-label{font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--steel-light); margin-bottom:6px;}
  .sources a{display:block; font-size:12px; color:#7fa8c9; text-decoration:none; margin-bottom:4px; word-break:break-all;}
</style>
</head>
<body>
<div class="wrap">
  <div class="plate">
    <p class="eyebrow">Nick — Auto Parts, Brasília</p>
    <h1>Cotador</h1>
    <p class="sub">Type a part or SKU. Checks Brasília suppliers, the cheapest source anywhere, and current exchange rates, then prices it at your 45% markup.</p>
  </div>

  <div class="ticket">
    <label for="partInput">Part description or SKU</label>
    <input type="text" id="partInput" placeholder="e.g. oil filter Fiat Uno 1.0">
    <label for="qtyInput">Quantity</label>
    <input type="number" id="qtyInput" value="1" min="1" step="1">
    <button id="quoteBtn">Get quote</button>
  </div>

  <div id="output"></div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

const quoteBtn = document.getElementById('quoteBtn');
const output = document.getElementById('output');

function fmtBRL(n){
  if (typeof n !== 'number' || isNaN(n)) return '—';
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function esc(s){ const d = document.createElement('div'); d.innerText = s; return d.innerHTML; }

quoteBtn.addEventListener('click', async () => {
  const part = document.getElementById('partInput').value.trim();
  const quantity = parseInt(document.getElementById('qtyInput').value) || 1;
  if(!part){
    output.innerHTML = '<div class="error-box">Type a part description or SKU first.</div>';
    return;
  }
  quoteBtn.disabled = true;
  quoteBtn.textContent = 'Searching…';
  output.innerHTML = '<div class="ticket"><div class="loading">Checking suppliers and exchange rates…</div></div>';

  try{
    const res = await fetch('/api/quote', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ part, quantity })
    });
    const data = await res.json();
    if(!res.ok){
      output.innerHTML = `<div class="error-box">${esc(data.error || 'Something went wrong.')}</div>`;
      return;
    }
    render(data);
  }catch(err){
    output.innerHTML = `<div class="error-box">Could not reach the server. Check your connection and try again.</div>`;
  }finally{
    quoteBtn.disabled = false;
    quoteBtn.textContent = 'Get quote';
  }
});

function render(r){
  const hasPrice = r.nick_price_brl_per_unit != null;
  const total = hasPrice ? r.nick_price_brl_per_unit * (r.quantity||1) : null;
  let flag = '';
  if(r.undercut_flag){
    flag = `<div class="flag-box"><strong>Competitor undercutting by 20%+.</strong> ${esc(r.competitor_source||'A Brasília competitor')} is pricing this well below your rate.</div>`;
  }
  const caveat = r.caveats && r.caveats.trim() ? `<div class="caveat"><strong>Note:</strong> ${esc(r.caveats)}</div>` : '';
  const sources = (r.sources && r.sources.length) ? `<div class="sources"><div class="sources-label">Sources checked</div>${r.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a>`).join('')}</div>` : '';

  output.innerHTML = `
    <div class="result">
      <div class="result-head">${esc(r.part_matched || 'Part')}</div>
      <div class="headline-price">
        <div class="amt">${hasPrice ? fmtBRL(r.nick_price_brl_per_unit) : '—'}</div>
        <div class="cap">Per unit, 45% markup on cost</div>
      </div>
      ${flag}
      <div class="result-body">
        <div class="line-item"><span class="line-label">Cost price</span><span class="line-value">${r.cost_price_brl_per_unit!=null?fmtBRL(r.cost_price_brl_per_unit):'—'}</span></div>
        ${r.exchange_rate_used ? `<div class="line-item"><span class="line-label">Exchange rate</span><span class="line-value" style="font-family:Arial;font-size:12.5px;">${esc(r.exchange_rate_used)}</span></div>` : ''}
        <div class="line-item"><span class="line-label">Competitor price</span><span class="line-value">${r.competitor_price_brl_per_unit!=null?fmtBRL(r.competitor_price_brl_per_unit):'—'}</span></div>
        ${hasPrice && (r.quantity||1)>1 ? `<div class="line-item"><span class="line-label">Total (qty ${r.quantity})</span><span class="line-value">${fmtBRL(total)}</span></div>` : ''}
        <div class="line-item"><span class="line-label">Bulk pricing</span><span class="line-value" style="font-family:Arial;font-size:12.5px;text-align:right;max-width:60%;">${esc(r.bulk_pricing_note||'—')}</span></div>
      </div>
      ${caveat}
      ${sources}
    </div>
  `;
}
</script>
</body>
</html>
